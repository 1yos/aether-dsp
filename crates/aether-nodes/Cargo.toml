[package]
name = "aetherdsp-nodes"
version = "0.2.4"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aetherdsp-nodes"
readme = "README.md"
description = "Built-in DSP nodes for AetherDSP — oscillator, filters, reverb, LFO, granular, Karplus-Strong, compressor, waveshaper, chorus"
keywords = ["audio", "dsp", "oscillator", "filter", "synthesis"]
categories = ["multimedia::audio"]

[lib]
name = "aether_nodes"

[features]
default = ["all-nodes"]
all-nodes = [
    "oscillator",
    "filter",
    "reverb",
    "delay",
    "compressor",
    "envelope",
    "lfo",
    "gain",
    "mixer",
    "moog-ladder",
    "formant",
    "granular",
    "karplus-strong",
    "waveshaper",
    "chorus",
    "eq",
    "limiter",
    "gate",
    "panner",
    "record",
    "scope",
]
oscillator = []
filter = []
reverb = []
delay = []
compressor = []
envelope = []
lfo = []
gain = []
mixer = []
moog-ladder = []
formant = []
granular = []
karplus-strong = []
waveshaper = []
chorus = []
eq = []
limiter = []
gate = []
panner = []
record = []
scope = []

[dev-dependencies]
proptest = "1"
hound = "3"
ringbuf = { workspace = true }
rand = "0.8"

[dependencies]
aetherdsp-core = { version = "0.1", path = "../aether-core" }
serde = { workspace = true }
ringbuf = { workspace = true }
