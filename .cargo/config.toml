# Cross-platform Cargo configuration for Aether DSP
# Supports: Windows (MSVC), macOS, Linux

# Windows MSVC (recommended for Windows)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native"]

# Windows GNU (MinGW fallback - DISABLED for Iced UI compatibility)
# The Iced UI requires MSVC toolchain due to linker command-line length limitations
# [target.x86_64-pc-windows-gnu]
# linker = "C:\\msys64\\mingw64\\bin\\gcc.exe"
# ar = "C:\\msys64\\mingw64\\bin\\ar.exe"
# rustflags = [
#     "-C", "target-cpu=native",
#     "-C", "link-arg=-Wl,--allow-multiple-definition",
#     "-C", "link-arg=-Wl,--gc-sections",
# ]

# macOS (Apple Silicon)
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

# macOS (Intel)
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

# Linux
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

# [build]
# Build artifacts location
# Windows MSVC: Use C:\aether-target to avoid spaces in "D:\Audio kernel\"
# Linux/WSL: Use default target/ directory (this section is commented out)
# target-dir = "C:\\aether-target"

# Note: The target-dir is commented out so it works on both Windows and Linux.
# On Windows with MSVC, you can uncomment it if needed.
# On Linux/WSL, it will use the default ./target directory.

