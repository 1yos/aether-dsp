# Cross-platform Cargo configuration for Aether DSP
# Supports: Windows (MSVC), macOS, Linux

# Windows MSVC (recommended for Windows)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native"]

# Windows GNU (MinGW fallback - with linker workarounds)
[target.x86_64-pc-windows-gnu]
linker = "C:\\msys64\\mingw64\\bin\\gcc.exe"
ar = "C:\\msys64\\mingw64\\bin\\ar.exe"
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=-Wl,--allow-multiple-definition",
    "-C", "link-arg=-Wl,--gc-sections",
]

# macOS (Apple Silicon)
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

# macOS (Intel)
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

# Linux
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

[build]
# Put the build artifacts in a path with no spaces
# Windows: Use C:\aether-target to avoid spaces in "D:\Audio kernel\"
# Unix: Will use default target/ directory
target-dir = "C:\\aether-target"

# Note: On Unix systems, you may want to override this with:
# export CARGO_TARGET_DIR=./target
# or remove this section entirely for Unix builds

