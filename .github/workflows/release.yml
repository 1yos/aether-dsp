name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  # ── Build native binaries for all platforms ──────────────────────────────────
  build:
    name: Build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: aether-studio-linux-x86_64
            binary_name: aether-studio
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: aether-studio-macos-aarch64
            binary_name: aether-studio
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: aether-studio-macos-x86_64
            binary_name: aether-studio
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: aether-studio-windows-x86_64
            binary_name: aether-studio.exe

    steps:
      - uses: actions/checkout@v5

      # Fix environment variables
      - name: Workaround DYLD_FALLBACK_LIBRARY_PATH issue
        if: runner.os == 'macOS'
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=" >> $GITHUB_ENV

      - name: Set LD_LIBRARY_PATH safely
        if: runner.os == 'Linux'
        run: echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-/usr/local/lib}" >> $GITHUB_ENV

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || (sleep 15 && sudo apt-get update)
          for i in 1 2 3; do
            sudo apt-get install -y --fix-missing \
              libasound2-dev \
              pkg-config && break || sleep 15
          done

      - name: Build aether-studio
        run: cargo build --release -p aether-ui --target ${{ matrix.target }}

      - name: Create artifact directory
        run: mkdir -p dist

      - name: Copy binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/
          chmod +x dist/${{ matrix.binary_name }}

      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.binary_name }}
          cd ..

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path ${{ matrix.binary_name }} -DestinationPath ${{ matrix.artifact_name }}.zip
          cd ..

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip

  # ── Create GitHub Release and attach all artifacts ───────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Extract changelog section for this version from CHANGELOG.md if it exists
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[${{ steps.version.outputs.version }}\]/,/^## \[/" CHANGELOG.md \
              | head -n -1 > release_notes.md
          else
            echo "Aether Studio v${{ steps.version.outputs.version }}" > release_notes.md
            echo "" >> release_notes.md
            echo "Native GPU-accelerated DAW built with Rust + Iced" >> release_notes.md
            echo "" >> release_notes.md
            echo "See [README](README.md) for full feature list and build instructions." >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Aether Studio v${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
