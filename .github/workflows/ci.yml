name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Faster linker on Linux
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  # Opt into Node.js 24 for all actions (checkout, setup-node, etc.)
  # Required before GitHub forces it on June 2nd, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # Fix DYLD_FALLBACK_LIBRARY_PATH issue on macOS - MUST be first
      - name: Workaround DYLD_FALLBACK_LIBRARY_PATH issue
        if: runner.os == 'macOS'
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=" >> $GITHUB_ENV

      # Fix LD_LIBRARY_PATH issue on Linux - MUST be before Rust install
      - name: Set LD_LIBRARY_PATH safely
        if: runner.os == 'Linux'
        run: |
          if [ -z "${LD_LIBRARY_PATH}" ]; then
            echo "LD_LIBRARY_PATH=/usr/local/lib" >> $GITHUB_ENV
          else
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:/usr/local/lib" >> $GITHUB_ENV
          fi

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      # Swatinem/rust-cache caches per-crate artifacts separately —
      # changing one crate doesn't bust the cache for everything else.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Each OS gets its own cache shard
          key: ${{ matrix.os }}

      - name: Install ALSA dev headers (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || (sleep 15 && sudo apt-get update)
          for i in 1 2 3; do
            sudo apt-get install -y --fix-missing libasound2-dev && break || sleep 15
          done

      # check + test + clippy in one compiler pass each (no redundant rebuilds)
      - name: cargo check --workspace
        run: cargo check --workspace

      - name: cargo test (core crates only)
        run: cargo test --lib -p aetherdsp-core -p aetherdsp-nodes -p aetherdsp-ndk -p aetherdsp-midi -p aether-ui

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings -A dead_code

      # Benchmark only on pushes to main (not every PR) to save ~5 min per run
      - name: Benchmark regression check (main branch Linux only)
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cargo bench -p aetherdsp-core --bench rt_bench -- param_fill_buffer_64 2>&1 | tee bench_out.txt
          if grep -q "param_fill_buffer_64" bench_out.txt; then
            echo "Benchmark completed successfully"
          fi

      - name: Verify RT thread has no allocations (Linux only)
        if: runner.os == 'Linux'
        run: cargo check -p aetherdsp-core -p aetherdsp-nodes --features assert_no_alloc 2>/dev/null || true

  # UI and Tauri jobs disabled - React UI removed in v0.3
  # The production UI is now the native Iced application in crates/aether-ui
  # To build the DAW: cargo build --release -p aether-ui

